<title>Home Ready Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: Funding Dept brand band (charcoal + gold, matches the payment calculator and homebuyer guides), one question card at a time; results split into two columns on laptops */
:root{
  --bg:#f1f1f3; --card:#ffffff; --ink:#17181c; --muted:#5d6068; --line:#dcdde1;
  --accent:#a87a22; --accent-hover:#8f6719; --accent-ink:#ffffff;
  --pressed:#1c1d21; --pressed-ink:#e7c46e;
  --soft:#f1f1f3; --soft-2:#f6efe0;
  --brand-bg:#16171a; --brand-bg2:#2a2b30; --brand-gold:#d6a94c; --brand-ink:#ffffff; --brand-muted:#c9cad0;
  --good:#2f7d4f; --warn:#a87a22; --bad:#c2643b;
  --display:"Montserrat",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111214; --card:#1b1c20; --ink:#eeeef0; --muted:#9a9da6; --line:#2e3036;
  --accent:#d9ad55; --accent-hover:#e6bd6a; --accent-ink:#16171a;
  --pressed:#d9ad55; --pressed-ink:#16171a;
  --soft:#111214; --soft-2:#2a2620;
  --good:#5fc28a; --warn:#d9ad55; --bad:#e07f55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111214; --card:#1b1c20; --ink:#eeeef0; --muted:#9a9da6; --line:#2e3036;
  --accent:#d9ad55; --accent-hover:#e6bd6a; --accent-ink:#16171a;
  --pressed:#d9ad55; --pressed-ink:#16171a;
  --soft:#111214; --soft-2:#2a2620;
  --good:#5fc28a; --warn:#d9ad55; --bad:#e07f55; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding-inline:16px;padding-block:16px 40px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* brand band */
.brand{position:relative;overflow:hidden;border-radius:16px;color:var(--brand-ink);padding:20px 22px 22px;display:grid;gap:14px;
  background:
    linear-gradient(115deg,transparent 58%,rgba(214,169,76,.55) 58.3%,transparent 58.7%),
    linear-gradient(128deg,transparent 70%,rgba(214,169,76,.35) 70.2%,transparent 70.5%),
    linear-gradient(160deg,var(--brand-bg2),var(--brand-bg) 70%)}
.brand.compact{padding:14px 18px}
.logos{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logos .fd{height:52px;width:auto;display:block}
.powered{display:flex;align-items:center;gap:10px;font:600 .68rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--brand-muted)}
.powered img{height:36px;width:auto;display:block}
.brand.compact .logos .fd{height:40px}.brand.compact .powered img{height:28px}
.brand h1{font:800 clamp(1.7rem,5.2vw,2.5rem)/1.1 var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em;max-width:20ch}
.brand h1 em{font-style:normal;color:var(--brand-gold)}
.brand .lede{margin:0;color:var(--brand-muted);max-width:56ch;font-size:16px}
#bandText:empty{display:none}
@media (max-width:420px){.logos .fd{height:44px}.powered img{height:30px}}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;border-radius:6px;transition:width .3s}
.step-meta{text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;font-weight:600;color:var(--accent)}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0}
h2{font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
p{margin:0}
.hint{color:var(--muted);font-size:14px}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;font-weight:600;color:var(--muted)}
.hero-photo{position:relative;border-radius:12px;overflow:hidden}
.hero-photo img{display:block;width:100%;height:auto;aspect-ratio:900/608;object-fit:cover}
.hero-photo figcaption{position:absolute;left:12px;bottom:12px;background:var(--brand-bg);color:var(--brand-gold);font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 12px;letter-spacing:.02em}

.choices{display:grid;gap:10px}
.choice{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:13px 16px;display:flex;flex-direction:column;gap:2px;background:var(--soft);font-weight:600;transition:border-color .15s,background .15s,color .15s}
.choice small{color:var(--muted);font-size:13px;font-weight:400}
.choice:hover{border-color:var(--accent)}
.choice[aria-pressed="true"]{background:var(--pressed);color:var(--pressed-ink);border-color:var(--pressed)}
.choice[aria-pressed="true"] small{color:var(--pressed-ink);opacity:.8}
.choice:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.choices.two{grid-template-columns:1fr 1fr}
@media (max-width:420px){.choices.two{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
.callpick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.callpick>*{min-width:0}
@media (max-width:420px){.callpick{grid-template-columns:1fr}}
input[type=text],input[type=email],input[type=tel],input[type=date],select{font:500 1rem var(--body);color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:11px 12px;width:100%}
.money{position:relative}
.money::before{content:"$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.95rem}
.money input{padding-left:26px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;color:var(--ink)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{all:unset;box-sizing:border-box;cursor:pointer;font-weight:600;border-radius:10px;padding:13px 20px;text-align:center;transition:background .15s}
.btn.primary{background:var(--accent);color:var(--accent-ink);flex:1;min-width:160px;font-size:16px}
.btn.primary:hover:not([disabled]){background:var(--accent-hover)}
.btn.primary[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{color:var(--muted);padding-inline:6px}
.btn.ghost:hover{color:var(--accent)}
.err{color:var(--bad);font-size:14px;min-height:1em;font-weight:600}
.zip-note{font-size:14px;min-height:1.4em;color:var(--muted)}
.zip-note.ok{color:var(--good);font-weight:600}
.zip-note.err{color:var(--bad);font-weight:600}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--muted);line-height:1.45}
.consent input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--accent)}
.intro-list{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:15px}
.intro-list li{display:flex;gap:10px;align-items:flex-start}
.intro-list li::before{content:"✓";flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--brand-bg);background:var(--brand-gold);margin-top:1px}
.callask{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.callask .free{display:inline-flex;align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-gold);background:var(--brand-bg);border-radius:999px;padding:3px 10px}
.callask .choice{background:var(--card);padding-block:11px}

/* results */
.snap-head{display:flex;flex-direction:column;gap:4px;background:var(--brand-bg);color:var(--brand-ink);border-radius:12px;padding:20px 18px;border-top:3px solid var(--brand-gold);margin:-4px -2px 0}
.snap-head .eyebrow{color:var(--brand-gold)}
.snap-head .hint{color:var(--brand-muted)}
.snap-head h2{color:var(--brand-ink)}
.range{font:700 clamp(2.2rem,8vw,3rem)/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--brand-ink)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0}
.facts div{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.facts dt{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.facts dd{margin:0;font-weight:600;font-size:1.05rem;font-variant-numeric:tabular-nums}
.checks{display:grid;gap:12px}
.check{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 11px;white-space:nowrap}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.check b{font-size:15px}
.check p{grid-column:2;color:var(--muted);font-size:14px}
.plan{margin:0;padding:0;list-style:none;counter-reset:p;display:grid;gap:12px}
.plan li{counter-increment:p;display:grid;grid-template-columns:30px 1fr;gap:2px 12px}
.plan li::before{content:counter(p);grid-row:span 2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--display);background:var(--soft);border:1px solid var(--line);color:var(--ink)}
.plan li:first-child::before{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plan li b{display:block}
.plan li span{color:var(--muted);font-size:14px}
.keys-photo{border-radius:12px;overflow:hidden;position:relative;margin:0}
.keys-photo img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;max-height:300px}
.keys-photo figcaption{position:absolute;inset:auto 0 0 0;padding:28px 16px 14px;background:linear-gradient(transparent,rgba(22,23,26,.85));color:var(--brand-ink);font:800 19px var(--display)}
.deliver-warn{background:var(--soft-2);border:1px solid var(--accent);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.deliver-warn .btn.primary{min-width:140px}
.cta{background:var(--brand-bg);color:var(--brand-ink);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--brand-gold)}
.cta b{font-family:var(--display);font-size:15px}
.cta .hint{color:var(--brand-muted)}
.agent{display:flex;gap:14px;align-items:center}
.agent img{width:64px;height:64px;border-radius:50%;flex:none;border:2px solid var(--brand-gold)}
.contact{display:flex;flex-direction:column;gap:2px;font-size:15px}
.agent .contact b{font:800 1.05rem var(--display);letter-spacing:.03em;text-transform:uppercase}
.agent .contact small{color:var(--brand-muted);font-size:12.5px}
.contact a{color:var(--brand-gold);font-weight:600;text-decoration:none;user-select:all;font-variant-numeric:tabular-nums}
.fine{font-size:12.5px;color:var(--muted);line-height:1.5}
.hr{height:1px;background:var(--line)}
.foot{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.res-grid,.res-col,.res-grid2{display:flex;flex-direction:column;gap:18px}
@media (min-width:760px){.wrap{max-width:660px}}
@media (min-width:1040px){
  body{display:flex;flex-direction:column}
  .wrap{margin:auto;width:100%}
  .wrap.wide{max-width:980px}
  .brand{padding:22px 24px 26px}
  .step-intro{display:grid;grid-template-columns:1.05fr 1fr;gap:14px 32px;align-items:center;padding:24px}
  .step-intro>.hero-photo{grid-column:1;grid-row:1/span 4;margin:0;height:100%}
  .step-intro>.hero-photo img{height:100%;aspect-ratio:auto;min-height:360px}
  .step-intro>:not(.hero-photo){grid-column:2}
  .step-results{padding:26px 24px}
  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 32px;align-items:start}
  .res-hr{display:none}
  .res-grid2{display:grid;grid-template-columns:1fr 1.15fr;gap:22px;align-items:stretch}
  .res-grid2 .keys-photo{min-height:280px}
  .res-grid2 .keys-photo img{position:absolute;inset:0;width:100%;height:100%;max-height:none;aspect-ratio:auto;object-fit:cover}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function choiceStep(s, meta){
  card.innerHTML = `${meta}<h2>${s.q}</h2>${s.hint?`<p class="hint">${s.hint}</p>`:""}
    <div class="choices ${s.grid?"two":""}">${s.opts.map(([v,l,sm])=>`<button class="choice" type="button" data-v="${v}" aria-pressed="${A[s.id]===v}"><span>${l}</span>${sm?`<small>${sm}</small>`:""}</button>`).join("")}</div>
    ${nav(!!A[s.id])}`;
  card.querySelectorAll(".choice").forEach(btn=>btn.onclick=()=>{ A[s.id]=btn.dataset.v; i++; render(); });
  wireNav();
}
function moneyStep(s, meta){
  const val = A[s.id]!=null ? A[s.id].toLocaleString("en-US") : "";
  card.innerHTML = `${meta}<h2>${s.q}</h2>${s.hint?`<p class="hint">${s.hint}</p>`:""}
    <label class="f"><span class="money"><input id="m_${s.id}" type="text" inputmode="numeric" autocomplete="off" placeholder="0" value="${val}" aria-label="${esc(s.q)}"></span></label>
    <div class="chips">${s.chips.map(c=>`<button class="chip" type="button" data-v="${c}">${c===0?"$0":fmt(c)}${s.id==="income"&&c===150000?"+":""}</button>`).join("")}</div>
    ${nav(false)}`;
  const inp = document.getElementById("m_"+s.id), next = document.getElementById("next");
  const ok = ()=>{ const t = inp.value.trim(); next.disabled = !(t!=="" && (s.allowZero ? num(t)>=0 : num(t)>0)); };
  inp.oninput = ()=>{ const n = num(inp.value); inp.value = inp.value.trim()==="" ? "" : n.toLocaleString("en-US"); ok(); };
  card.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ inp.value = Number(c.dataset.v).toLocaleString("en-US"); ok(); });
  inp.onkeydown = e=>{ if(e.key==="Enter" && !next.disabled) next.click(); };
  ok(); wireNav(()=>{ A[s.id]=num(inp.value); i++; render(); });
  if (matchMedia("(pointer:fine)").matches) inp.focus();
}
function zipStep(s, meta){
  card.innerHTML = `${meta}<h2>${s.q}</h2>${s.hint?`<p class="hint">${s.hint}</p>`:""}
    <label class="f">ZIP code<input id="zip" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="5" placeholder="93101" value="${esc(A.zip||"")}"></label>
    <p class="zip-note" id="zipNote"></p>
    ${nav(false)}`;
  const inp = document.getElementById("zip"), next = document.getElementById("next"), note = document.getElementById("zipNote");
  const check = ()=>{
    inp.value = inp.value.replace(/\D/g,"").slice(0,5);
    const r = lookupZip(inp.value);
    if (r){ note.className = "zip-note ok"; note.innerHTML = `<b>${r.county} County</b> · ${CONFIG.limitsYear} conforming loan limit ${fmt(r.limit)}`; next.disabled = false; }
    else if (inp.value.length === 5){ note.className = "zip-note err"; note.textContent = "That doesn't look like a California ZIP code. Daniel is licensed in California, so enter the California ZIP where you're shopping."; next.disabled = true; }
    else { note.className = "zip-note"; note.textContent = ""; next.disabled = true; }
  };
  inp.oninput = check;
  inp.onkeydown = e=>{ if(e.key==="Enter" && !next.disabled) next.click(); };
  check(); wireNav(()=>{ const r = lookupZip(inp.value); A.zip = r.zip; A.county = r.county; A.limit = r.limit; i++; render(); });
  if (matchMedia("(pointer:fine)").matches) inp.focus();
}
function workStep(s, meta){
  const types = [["w2","Salary or hourly (W-2)"],["self","Self-employed or 1099"],["commission","Commission or bonus-based"],["retired","Retired or fixed income"],["other","Other"]];
  card.innerHTML = `${meta}<h2>${s.q}</h2>
    <label class="f">Job title or line of work<input id="job" type="text" autocomplete="organization-title" placeholder="e.g. Nurse, electrician, small business owner" value="${esc(A.job||"")}"></label>
    <div class="f" style="font-weight:600;font-size:14px">How are you paid?</div>
    <div class="choices">${types.map(([v,l])=>`<button class="choice" type="button" data-v="${v}" aria-pressed="${A.payType===v}"><span>${l}</span></button>`).join("")}</div>
    ${nav(false)}`;
  const job = document.getElementById("job"), next = document.getElementById("next");
  const ok = ()=>{ next.disabled = !(job.value.trim() && A.payType); };
  job.oninput = ok;
  card.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{ A.payType=b.dataset.v; card.querySelectorAll(".choice").forEach(x=>x.setAttribute("aria-pressed", x===b)); ok(); });
  ok(); wireNav(()=>{ A.job = job.value.trim(); A.work = A.job; i++; render(); });
}

  wireNav(()=>{
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const err = document.getElementById("err");
    const digits = phone.replace(/\D/g,"").replace(/^1(?=\d{10}$)/,"");
    if (name.split(/\s+/).length < 2) return err.textContent = "Enter your first and last name.";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return err.textContent = "Enter a valid email address, like name@example.com.";
    if (digits.length !== 10) return err.textContent = "Enter a 10-digit phone number.";
    if (A.wantsCall==null) return err.textContent = "Choose yes or no for the free discovery call.";
    const callDate = A.wantsCall ? document.getElementById("callDate").value : "";
    if (A.wantsCall && !callDate) return err.textContent = "Pick a day for your free call.";
    Object.assign(A, {name, email, phone: `(${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6)}`, consent: document.getElementById("consent").checked, callDate, callTime: A.wantsCall ? document.getElementById("callTime").value : ""});
    i++; render();
  });
}

/* ===== Estimate ===== */
function estimate(a){
  const M = a.income/12, c = credit[a.credit];
  let program, minDown, mi, stretchDTI;
  if (a.vet==="yes"){ program="VA"; minDown=0; mi=0; stretchDTI=.50; }
  else { program="FHA"; minDown = c.score<580 ? .10 : .035; mi=.0055; stretchDTI=.50; } // everyone not VA is quoted on FHA terms
  const priced = program==="VA" ? "VA" : "FHA"; // VA-eligible get VA pricing; everyone else is quoted FHA pricing
  const rate = ((priced==="VA" ? CONFIG.vaRate : CONFIG.baseRate) + c.add*.5)/100;
  const r = rate/12, n = 360;
  const pmtFactor = r/(1-Math.pow(1+r,-n));
  function cost(price){
    const down = Math.min(price, Math.max(minDown*price, a.savings - CONFIG.closingRate*price));
    const loan = price - down;
    const pmi = (down/price < .2) ? loan*mi/12 : 0;
    return {total: loan*pmtFactor + price*CONFIG.taxInsRate/12 + pmi, down, loan, pi: loan*pmtFactor, pmi};
  }
  function maxPrice(budget){
    if (budget<=0) return 0;
    let lo=0, hi=5e6;
    for (let k=0;k<60;k++){ const mid=(lo+hi)/2; cost(mid).total<=budget ? lo=mid : hi=mid; }
    return Math.floor(lo/5000)*5000;
  }
  function maxPriceByLoan(cap){
    let lo=0, hi=5e6;
    for (let k=0;k<60;k++){ const mid=(lo+hi)/2; cost(mid).loan<=cap ? lo=mid : hi=mid; }
    return Math.floor(lo/5000)*5000;
  }
  const consBudget = Math.min(M*.31, M*.36 - a.debts);
  const strBudget = M*stretchDTI - a.debts;
  let low = maxPrice(consBudget), high = Math.max(low, maxPrice(strBudget));
  // FHA estimates are capped at the county conforming loan limit; VA (full entitlement) is not
  const limit = a.limit || null;
  let capped = false, capPrice = null, uncappedHigh = high;
  if (priced==="FHA" && limit){
    capPrice = maxPriceByLoan(limit);
    if (high > capPrice){ capped = true; high = capPrice; }
    if (low > capPrice) low = capPrice;
  }
  const mid = Math.round((low+high)/2/5000)*5000;
  const midCost = cost(mid||1);
  const cashNeeded = mid*(minDown + CONFIG.closingRate);
  const backDTI = M>0 ? (a.debts/M) : 1;
  return {program, priced, rate, low, high, mid, midCost, cashNeeded, backDTI, M, minDown, score:c.score, limit, capped, capPrice, uncappedHigh, county:a.county};
}

function results(){
  const e = estimate(A);
  A.estimate = {low:e.low, high:e.high, program:e.program, pricedAs:e.priced, ratePct:+(e.rate*100).toFixed(3), monthlyAtMid:Math.round(e.midCost.total), county:A.county, countyLimit:A.limit, cappedAtLimit:e.capped, uncappedHigh:e.uncappedHigh};
  sendLead();

  const first = A.name.split(" ")[0];
  const checks = [];
  // Credit
  if (e.score>=700) checks.push(["good","Strong","Credit","Your estimated score qualifies for most programs at competitive rates."]);
  else if (e.score>=620) checks.push(["warn","Workable","Credit","You can qualify now, and every 20-point bump can lower your rate and mortgage insurance."]);
  else if (e.score>=580) checks.push(["warn","FHA range","Credit","FHA allows scores from 580 with 3.5% down. Raising your score widens your options."]);
  else checks.push(["bad","Build first","Credit","Most programs need 580+. A few months of focused credit work can change this."]);
  if (A.credit==="unsure") checks[0][3] = "We assumed a mid-range score. A soft-pull credit review will give you the real number.";
  // DTI
  const d = Math.round(e.backDTI*100);
  if (d<=15) checks.push(["good",`${d}% of income`,"Monthly debts","Low existing debt leaves most of your budget for a house payment."]);
  else if (d<=30) checks.push(["warn",`${d}% of income`,"Monthly debts","Manageable, but paying down a small balance could add buying power."]);
  else checks.push(["bad",`${d}% of income`,"Monthly debts","High debts are your biggest limit. Paying these down raises your price range fastest."]);
  // Cash
  const gap = e.cashNeeded - A.savings;
  if (gap<=0) checks.push(["good","Covered","Cash to close",`Your savings cover the estimated down payment and closing costs at ${fmtK(e.mid)}.`]);
  else if (gap < e.cashNeeded*.5) checks.push(["warn",`About ${fmtK(gap)} short`,"Cash to close","Seller concessions plus down payment assistance can often close this gap. See your plan below."]);
  else checks.push(["bad",`About ${fmtK(gap)} short`,"Cash to close","Seller concessions plus down payment assistance can cover much of this. See your plan below."]);

  // Plan
  const plan = [];
  if (gap>0) plan.push(["Cover your cash to close with seller concessions + down payment assistance",
    `You're about ${fmtK(gap)} short today, and that doesn't have to stop you. Sellers can pay part of your closing costs (seller concessions), and down payment assistance programs can help with the down payment. Used together, they can cut the cash you need at closing and make it much easier to get into ${A.history==="first"?"your first home":"your next home"}.`]);
  if (e.capped) plan.push(["Compare conventional and jumbo options",`Your income supports more than the ${fmt(e.limit)} loan limit for ${esc(A.county)} County. Above that, a conventional or jumbo loan can go higher, and Daniel can compare them side by side with your FHA numbers.`]);
  if (e.score<640 || A.credit==="unsure") plan.push(["Get a credit game plan","Keep card balances under 30% of their limits, pay every bill on time, and don't open new credit before you buy."]);
  if (d>20) plan.push(["Target your highest payment","Paying off a small loan or card entirely removes its monthly payment from your ratio, which matters more than the balance."]);
  if (gap>0) plan.push(["Ask about gift funds","Money from family can often count toward your down payment with a simple gift letter."]);
  if (A.payType==="self") plan.push(["Gather 2 years of tax returns","Lenders qualify self-employed income on what's left after write-offs, so a review of your returns now avoids surprises."]);
  if (A.payType==="commission") plan.push(["Document your commission history","Lenders typically average two years of commission or bonus income."]);
  if (A.history==="own") plan.push(["Decide: sell, keep, or rent out","Your current home's equity could fund your next down payment, or rental income could help you qualify."]);
  if (e.program==="VA") plan.push(["Request your VA Certificate of Eligibility","It's free and confirms your zero-down VA benefit."]);
  if (gap<=0) plan.push(["Use seller credits to lower your payment","Negotiated seller credits can buy down your rate or cover closing costs, and many buyers never ask."]);
  plan.push(["Get fully pre-approved before you shop","A real pre-approval verifies your income and credit so sellers take your offer seriously."]);

  const noRange = e.high < 100000;
  card.innerHTML = `
    <div class="snap-head"><div class="eyebrow">Pre-qual snapshot for ${esc(first)}</div>
    ${noRange ? `<h2>Let's build your buying power first</h2><p class="hint">With your current income and debts, a payment doesn't fit yet. The plan below shows what to work on, and Daniel can map out a timeline with you.</p>`
      : `<p class="hint">Estimated price range</p><div class="range">${(e.low < 50000 || e.low === e.high) ? "Up to " + fmtK(e.high) : fmtK(e.low) + " – " + fmtK(e.high)}</div>
      <p class="hint">${e.capped ? `Capped at the ${fmt(e.limit)} ${CONFIG.limitsYear} conforming loan limit for ${esc(A.county)} County. Your income could support more; see your plan below.` : "The low end is a comfortable budget. The high end is the most programs typically allow."}</p>`}</div>
    <div class="res-grid"><section class="res-col">
    ${noRange ? "" : `<dl class="facts">
      <div><dt>Likely program</dt><dd>${e.program}</dd></div>
      <div><dt>Est. payment at ${fmtK(e.mid)}</dt><dd>${fmt(e.midCost.total)}/mo</dd></div>
      <div><dt>Min. down payment</dt><dd>${e.minDown===0?"$0 (0%)":fmt(e.mid*e.minDown)+" ("+(e.minDown*100).toFixed(e.minDown===.035?1:0)+"%)"}</dd></div>
      <div><dt>Est. rate (${e.priced})</dt><dd>${(e.rate*100).toFixed(3)}%</dd></div>
      <div><dt>Shopping in</dt><dd>${esc(A.county)} County</dd></div>
      <div><dt>${CONFIG.limitsYear} loan limit</dt><dd>${fmt(e.limit)}${e.capped?" · applied":""}</dd></div>
    </dl>`}
    <div class="hr"></div>
    <h2 style="font-size:20px">Where you stand</h2>
    <div class="checks">${checks.map(([k,p,t,dsc])=>`<div class="check"><span class="pill ${k}">${p}</span><b>${t}</b><p>${dsc}</p></div>`).join("")}</div>
    </section><section class="res-col">
    <div class="hr res-hr"></div>
    <h2 style="font-size:20px">Your get-ready plan</h2>
    <ol class="plan">${plan.slice(0,5).map(([t,dsc])=>`<li><b>${t}</b><span>${dsc}</span></li>`).join("")}</ol>

    "Military": A.vet === "yes" ? "Yes" : "No",
    "ZIP / County": `${A.zip} · ${A.county} County (${CONFIG.limitsYear} limit ${fmt(A.limit)})`,
    "Estimate": A.estimate.high ? `${A.estimate.low===A.estimate.high ? "Up to " + fmt(A.estimate.high) : fmt(A.estimate.low) + " to " + fmt(A.estimate.high)}, ${A.estimate.program} at ${A.estimate.ratePct}%${A.estimate.cappedAtLimit ? " (capped at county limit; income supports up to " + fmt(A.estimate.uncappedHigh) + ")" : ""}` : "No range yet",
    "lead_json": JSON.stringify(lead)
  };
  const payload = JSON.stringify(body);
  const qid = "hrc_" + Date.now();
  queuePut(qid, payload);                      // kept locally until delivery is confirmed
  A._fallback = {name: A.name, phone: A.phone, email: A.email, est: body["Estimate"], call: body["Requested call"], county: A.county};
  (async () => {
    const ok = await deliver(payload, 3);
    if (ok) { A._delivered = true; queueDel(qid); }
    else showDeliveryFallback();
  })();
}

/* ===== Delivery helpers: retries, a local queue that resends on later visits, and a visible fallback ===== */
const LEAD_URL = "https://formsubmit.co/ajax/" + encodeURIComponent(CONFIG.leadEmail);
async function deliver(payload, attempts){
  for (let attempt = 1; attempt <= attempts; attempt++) {
    try {
      const res = await fetch(LEAD_URL, {method:"POST", headers:{"Content-Type":"application/json", "Accept":"application/json"}, body: payload, keepalive: true});
      if (res.ok) return true;
    } catch(e) {}
    if (attempt < attempts) await new Promise(r => setTimeout(r, 1500 * attempt));
  }
  return false;
}
function queuePut(id, payload){ try { localStorage.setItem(id, payload); } catch(e){} }
function queueDel(id){ try { localStorage.removeItem(id); } catch(e){} }
async function resendQueued(){
  let keys = [];
  try { keys = Object.keys(localStorage).filter(k => k.startsWith("hrc_")); } catch(e){ return; }
  for (const k of keys) {
    let payload = null; try { payload = localStorage.getItem(k); } catch(e){}
    if (!payload) { queueDel(k); continue; }
    const age = Date.now() - Number(k.slice(4));
    if (age > 14*24*3600*1000) { queueDel(k); continue; }   // give up after two weeks
    if (await deliver(payload, 2)) queueDel(k);
  }
}
function showDeliveryFallback(){
  const cta = document.querySelector(".cta"); if (!cta || !A._fallback) return;
  const f = A._fallback;
  const msg = `Hi Daniel, I just finished the Home Ready Check. ${f.name}, ${f.phone}, ${f.email}. ${f.county} County. Estimate: ${f.est}. Call: ${f.call}.`;
  const sms = "sms:+1" + CONFIG.phone.replace(/\D/g,"") + "?&body=" + encodeURIComponent(msg);
  const mail = "mailto:" + CONFIG.email + "?subject=" + encodeURIComponent("Home Ready Check: " + f.name) + "&body=" + encodeURIComponent(msg);
  const box = document.createElement("div");
  box.className = "deliver-warn";
  box.innerHTML = `<b>One more tap to make sure Daniel gets your results.</b><p class="hint">Our form service didn't confirm your submission, so send it directly. Your message is already written; just hit send.</p>
    <div class="row"><a class="btn primary" href="${sms}">Text my results to Daniel</a><a class="btn primary" href="${mail}">Email instead</a></div>`;
  cta.parentNode.insertBefore(box, cta);
}

render();
resendQueued();

// Load today's rates from rates.json (same folder). Falls back to the CONFIG values above if unavailable.
(async function loadRates(){
  try {
    const res = await fetch(CONFIG.ratesUrl + "?t=" + Date.now(), {cache: "no-store"});
    if (!res.ok) return;
    const j = await res.json();
    const fha = (j.fhaOverride != null) ? Number(j.fhaOverride) : Number(j.fha);
    const va = Number(j.va);
    const okDate = /^\d{4}-\d{2}-\d{2}$/.test(String(j.asOf||""));
    if (fha > 3 && fha < 12 && va > 3 && va < 12 && okDate){ CONFIG.baseRate = fha; CONFIG.vaRate = va; CONFIG.rateDate = j.asOf; }
  } catch (e) { /* keep fallback rates */ }
})();
</script>
